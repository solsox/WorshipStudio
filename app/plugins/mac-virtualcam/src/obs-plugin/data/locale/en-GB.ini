Error.SystemExtension.NotInstalled.MacOS15="The virtual camera is not installed.\n\nPlease allow WorshipStudio to install the camera system extension in System Settings → General → Login Items & Extensions → Camera Extensions.\n\nYou may need to restart WorshipStudio if this message still appears afterwards."
Error.SystemExtension.WrongLocation="WorshipStudio cannot install the virtual camera if it's not in \"/Applications\". Please move WorshipStudio to the \"/Applications\" directory."
Error.SystemExtension.CompleteAfterReboot="The installation of the virtual camera will be completed after a system reboot."
