name: Compilar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

# Online Bibles (Reina Valera 1960/1995...): app key of the YouVersion Platform.
env:
  WORSHIPSTUDIO_YOUVERSION_KEY: ${{ secrets.YOUVERSION_KEY }}
  # Free backgrounds search: API key of Pexels.
  WORSHIPSTUDIO_PEXELS_KEY: ${{ secrets.PEXELS_KEY }}

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Usar Xcode 26.5 (lo exige OBS)
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
      - name: Configurar
        run: |
          cmake --preset macos -B build_macos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DOBS_CODESIGN_IDENTITY=- \
            -DENABLE_BROWSER=ON -DENABLE_WHATSNEW=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF
      - name: Compilar
        run: cmake --build build_macos --config RelWithDebInfo -- -quiet
      - name: Empaquetar
        run: |
          mkdir -p ../dist
          # Third-party plugins (submodules) also say WorshipStudio
          python3 ../herramientas/limpiar-marca.py build_macos/frontend/RelWithDebInfo/WorshipStudio.app
          ditto -c -k --keepParent build_macos/frontend/RelWithDebInfo/WorshipStudio.app ../dist/WorshipStudio-macOS-arm64.zip
          # Disk image: drag WorshipStudio onto Applications
          mkdir -p dmg && ditto build_macos/frontend/RelWithDebInfo/WorshipStudio.app dmg/WorshipStudio.app
          ln -s /Applications dmg/Aplicaciones
          hdiutil create -volname WorshipStudio -srcfolder dmg -ov -format UDZO ../dist/WorshipStudio-macOS-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: WorshipStudio-macOS-arm64
          path: |
            dist/WorshipStudio-macOS-arm64.zip
            dist/WorshipStudio-macOS-arm64.dmg
      - name: Adjuntar a la version
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ../dist/WorshipStudio-macOS-arm64.zip ../dist/WorshipStudio-macOS-arm64.dmg --clobber

  windows:
    name: Windows x64
    runs-on: windows-2025-vs2026
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configurar
        run: cmake --preset windows-x64 -DENABLE_BROWSER=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF
      - name: Compilar
        run: cmake --build --preset windows-x64 --config RelWithDebInfo --parallel
      - name: Instalar
        run: cmake --install build_x64 --prefix build_x64/WorshipStudio --config RelWithDebInfo
      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          python ../herramientas/limpiar-marca.py build_x64/WorshipStudio
          "Abri bin\64bit\WorshipStudio.exe para empezar." | Out-File build_x64/WorshipStudio/LEEME.txt -Encoding utf8
          Compress-Archive -Path build_x64/WorshipStudio -DestinationPath ../dist/WorshipStudio-Windows-x64.zip -Force
      - name: Instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          $version = (Select-String -Path frontend/docks/WorshipVersion.hpp -Pattern '"([0-9.]+)"').Matches[0].Groups[1].Value
          $source = (Resolve-Path build_x64/WorshipStudio).Path
          $output = (Resolve-Path ../dist).Path
          & $iscc "/DAppVersion=$version" "/DSourceDir=$source" "/DOutputDir=$output" ../instalador/windows/WorshipStudio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: WorshipStudio-Windows-x64
          path: |
            dist/WorshipStudio-Windows-x64.zip
            dist/WorshipStudio-Windows-x64-Instalador.exe
      - name: Adjuntar a la version
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ../dist/WorshipStudio-Windows-x64.zip ../dist/WorshipStudio-Windows-x64-Instalador.exe --clobber

  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config extra-cmake-modules \
            qt6-base-dev qt6-base-private-dev libqt6svg6-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev \
            libcurl4-openssl-dev libjansson-dev libx11-xcb-dev libgl1-mesa-dev libgles2-mesa-dev libwayland-dev \
            libpipewire-0.3-dev libpulse-dev libx264-dev libmbedtls-dev uthash-dev libsimde-dev libluajit-5.1-dev \
            python3-dev swig libx11-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinerama0-dev libxcb-composite0-dev \
            libxinerama-dev libxcb1-dev libxcb-xfixes0-dev libxss-dev libglvnd-dev libxkbcommon-dev libasound2-dev \
            libfdk-aac-dev libfontconfig-dev libfreetype6-dev libjack-jackd2-dev libsndio-dev libspeexdsp-dev \
            libudev-dev libv4l-dev libva-dev libvlc-dev libpci-dev libdrm-dev nlohmann-json3-dev libwebsocketpp-dev \
            libasio-dev libqrcodegencpp-dev libxcb-xinput-dev \
            libffmpeg-nvenc-dev libvpl-dev libvpl2 libcmocka-dev lsb-release dh-cmake librist-dev libsrt-openssl-dev libglib2.0-dev poppler-utils
      - name: Configurar
        run: cmake --preset ubuntu -DENABLE_BROWSER=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Compilar
        run: cmake --build build_ubuntu
      - name: Empaquetar
        run: |
          cmake --install build_ubuntu --prefix "$PWD/WorshipStudio"
          python3 ../herramientas/limpiar-marca.py WorshipStudio
          cat > WorshipStudio/worshipstudio.sh <<'SH'
          #!/bin/sh
          # Lanzador: usa las bibliotecas que vienen en esta carpeta.
          HERE="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/lib:$HERE/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH"
          exec "$HERE/bin/worshipstudio" "$@"
          SH
          chmod +x WorshipStudio/worshipstudio.sh
          mkdir -p ../dist
          tar -czf ../dist/WorshipStudio-Linux-x86_64.tar.gz WorshipStudio
      - uses: actions/upload-artifact@v4
        with:
          name: WorshipStudio-Linux-x86_64
          path: dist/WorshipStudio-Linux-x86_64.tar.gz
      - name: Adjuntar a la version
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ../dist/WorshipStudio-Linux-x86_64.tar.gz --clobber
